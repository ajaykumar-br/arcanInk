# Credentials (POSTGRES_USER, POSTGRES_PASSWORD, JWT_SECRET) have no defaults on purpose:
# compose refuses to start until they are set in .env. See .env.example.
#
# Run everything:  docker compose up --build
# Then open http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-arcanink}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot: applies Prisma migrations, then exits
  migrate:
    build:
      context: .
      dockerfile: Docker/Dockerfile-http
    command: ["pnpm", "--filter", "@ajaykumar_br/db", "exec", "prisma", "migrate", "deploy"]
    working_dir: /usr/src/app
    environment:
      DATABASE_URL: &database_url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-arcanink}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  http-backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile-http
    restart: unless-stopped
    environment:
      DATABASE_URL: *database_url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ws-backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile-ws
    restart: unless-stopped
    environment:
      DATABASE_URL: *database_url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile-web
      args:
        NEXT_PUBLIC_HTTP_BACKEND_URL: ${NEXT_PUBLIC_HTTP_BACKEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - http-backend
      - ws-backend

volumes:
  pgdata:
